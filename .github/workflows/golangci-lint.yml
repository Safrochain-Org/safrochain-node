---
name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.11

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint-safrochaind
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          # Build the pinned linter with the job's Go toolchain: the prebuilt
          # v2.4.0 binary is built with Go 1.25 and refuses to lint a Go 1.26
          # module. Upgrading the linter itself (new rules) is a separate change.
          install-mode: goinstall
